plugins { id 'java' }

repositories {
    if (providers.gradleProperty('candidateRepository').isPresent()) {
        exclusiveContent {
            forRepository {
                maven {
                    url = uri(providers.gradleProperty('candidateRepository').get())
                }
            }
            filter { includeModule('io.github.lambig', 'toolbox-java') }
        }
    }
    mavenCentral()
}
dependencies {
    implementation "io.github.lambig:toolbox-java:${providers.gradleProperty('libraryVersion').getOrElse('0.4.0')}"
}
tasks.withType(JavaCompile).configureEach {
    options.release = 11
    options.encoding = 'UTF-8'
}
tasks.register('runExample', JavaExec) {
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'example.ToolboxExample'
    if (providers.environmentVariable('TEST_JAVA_HOME').isPresent()) {
        executable = providers.environmentVariable('TEST_JAVA_HOME').get() + '/bin/java'
    }
}

def versions = new Properties()
file('../library-versions.properties').withInputStream { versions.load(it) }
if (providers.gradleProperty('coexist').isPresent()) {
    dependencies { versions.each { artifact, release -> implementation "io.github.lambig:$artifact:$release" } }
}
tasks.register('writeClasspath') {
    def destination = layout.buildDirectory.file('runtime-classpath.txt')
    outputs.file(destination)
    doLast {
        destination.get().asFile.parentFile.mkdirs()
        destination.get().asFile.text = sourceSets.main.runtimeClasspath.asPath
    }
}
